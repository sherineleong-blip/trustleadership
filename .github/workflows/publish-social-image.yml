name: Publish social image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-social-image.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create social image
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > og-trust-leadership.png
          rm .github/workflows/publish-social-image.yml
      - name: Commit generated asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add social sharing image"
          git push
